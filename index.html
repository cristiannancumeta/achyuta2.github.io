<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Pixel Event Test Page</title>

    <!-- Meta Pixel Code -->
    <script>
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window,document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');

        fbq('init', '28368104826211072');
        fbq('track', 'PageView');
    </script>
    <noscript>
        <img height="1" width="1" style="display:none"
             src="https://www.facebook.com/tr?id=28368104826211072&ev=PageView&noscript=1" />
    </noscript>
    <!-- End Meta Pixel Code -->

    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 44rem; }
        button { padding: .6rem 1rem; margin: .25rem .25rem 0 0; cursor: pointer; }
        #log { font-family: monospace; font-size: .8rem; background: #f5f6f7;
               border: 1px solid #dddfe2; padding: .75rem; margin-top: 1rem;
               min-height: 5rem; max-height: 20rem; overflow: auto;
               white-space: pre-wrap; }
        #health { font-family: monospace; font-size: .85rem; margin-top: .5rem; }
    </style>
</head>

<body>
    <h1>Meta Pixel Event Test Page</h1>
    <p>Pixel ID: <code>28368104826211072</code></p>
    <div id="health">Checking pixel library…</div>

    <form id="userDetailsForm">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number"><br><br>

        <button type="button" id="addToCartButton">Add to Cart</button>
        <button type="button" id="addToWishlistButton">Add to Wishlist</button>
        <button type="button" id="purchaseButton">Purchase</button>
    </form>

    <div id="log">Waiting for events…</div>

    <script>
        var logEl = document.getElementById('log');
        var NL = String.fromCharCode(10);

        function logFired(eventName, params, opts) {
            var line = new Date().toLocaleTimeString() + '  ' + eventName +
                       (opts && opts.eventID ? '  [eventID ' + opts.eventID + ']' : '') +
                       NL + '    ' + JSON.stringify(params);
            logEl.textContent = line + NL + logEl.textContent;
            console.log('[pixel]', eventName, params, opts || '');
        }

        function uid(prefix) {
            return prefix + '-' + Date.now() + '-' +
                   Math.random().toString(36).slice(2, 8);
        }

        function randomValue() {
            return Math.round((10 + Math.random() * 90) * 100) / 100;
        }

        var baseParams = {
            content_name: 'Test Product',
            content_category: 'Example Category',
            content_ids: ['1234'],
            content_type: 'product',
            currency: 'USD'
        };

        function fire(eventName, extra, opts) {
            var params = Object.assign({}, baseParams, extra || {});
            if (opts) {
                fbq('track', eventName, params, opts);
            } else {
                fbq('track', eventName, params);
            }
            logFired(eventName, params, opts);
        }

        document.getElementById('addToCartButton')
            .addEventListener('click', function () {
                var id = uid('atc');
                fire('AddToCart', { value: randomValue() }, { eventID: id });
            });

        document.getElementById('addToWishlistButton')
            .addEventListener('click', function () {
                var id = uid('atw');
                fire('AddToWishlist', { value: randomValue() }, { eventID: id });
            });

        document.getElementById('purchaseButton')
            .addEventListener('click', function () {
                var orderId = uid('order');
                fire('Purchase', {
                    num_items: 1,
                    value: randomValue(),
                    order_id: orderId
                }, { eventID: orderId });
            });

        // Confirm the pixel library actually loaded (adblock check)
        (function pollHealth(attempt) {
            var el = document.getElementById('health');
            if (typeof fbq === 'function' && typeof fbq.callMethod === 'function') {
                el.textContent = '\u2705 fbevents.js loaded — events will be sent';
                el.style.color = '#31a24c';
            } else if (attempt > 20) {
                el.textContent = '\u274C fbevents.js did NOT load — events are being ' +
                                 'queued, not sent. Check adblocker / extensions.';
                el.style.color = '#e41e3f';
            } else {
                setTimeout(function () { pollHealth(attempt + 1); }, 250);
            }
        })(0);
    </script>
</body>
</html>
