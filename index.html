<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Pixel Event Test Page</title>

    <!-- Meta Pixel Code -->
    <script>
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window,document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');

        fbq('init', '48002403850441');
        fbq('track', 'PageView');
    </script>
    <noscript>
        <img height="1" width="1" style="display:none"
             src="https://www.facebook.com/tr?id=48002403850441&ev=PageView&noscript=1" />
    </noscript>
    <!-- End Meta Pixel Code -->

    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 40rem; }
        button { padding: .6rem 1rem; margin: .25rem .25rem 0 0; cursor: pointer; }
        #log { font-family: monospace; font-size: .85rem; background: #f5f6f7;
               border: 1px solid #dddfe2; padding: .75rem; margin-top: 1rem;
               min-height: 4rem; white-space: pre-wrap; }
    </style>
</head>

<body>
    <h1>Meta Pixel Event Test Page</h1>
    <p>Pixel ID: <code>48002403850441</code></p>

    <form id="userDetailsForm">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number"><br><br>

        <button type="button" id="addToCartButton">Add to Cart</button>
        <button type="button" id="addToWishlistButton">Add to Wishlist</button>
        <button type="button" id="purchaseButton">Purchase</button>
    </form>

    <div id="log">Waiting for events…</div>

    <script>
        var logEl = document.getElementById('log');

        function logFired(eventName, params) {
            var line = new Date().toLocaleTimeString() + '  ' + eventName +
                       '  ' + JSON.stringify(params);
            logEl.textContent = line + String.fromCharCode(10) + logEl.textContent;
            console.log('[pixel]', eventName, params);
        }

        var baseParams = {
            content_name: 'Test Product',
            content_category: 'Example Category',
            content_ids: ['1234'],
            content_type: 'product',
            value: 50.00,
            currency: 'USD'
        };

        function fire(eventName, extra) {
            var params = Object.assign({}, baseParams, extra || {});
            fbq('track', eventName, params);
            logFired(eventName, params);
        }

        document.getElementById('addToCartButton')
            .addEventListener('click', function () { fire('AddToCart'); });

        document.getElementById('addToWishlistButton')
            .addEventListener('click', function () { fire('AddToWishlist'); });

        document.getElementById('purchaseButton')
            .addEventListener('click', function () { fire('Purchase', { num_items: 1 }); });
    </script>
</body>
</html>
